<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#DDDDDD"/>
  <rect x="40" y="20" width="160" height="30" rx="4" fill="#9CA3AF"/>
  
  <!-- Date/Month selector -->
  <rect x="500" y="23" width="200" height="24" rx="4" fill="#CCCCCC"/>
  
  <!-- View toggles -->
  <rect x="920" y="25" width="60" height="20" rx="4" fill="#9CA3AF"/>
  <rect x="990" y="25" width="60" height="20" rx="4" fill="#EEEEEE"/>
  <rect x="1060" y="25" width="60" height="20" rx="4" fill="#EEEEEE"/>
  
  <!-- Left Sidebar -->
  <rect x="0" y="70" width="280" height="730" fill="#EEEEEE"/>
  
  <!-- Mini calendar -->
  <rect x="30" y="100" width="220" height="200" fill="white" stroke="#CCCCCC"/>
  <rect x="50" y="120" width="100" height="18" rx="4" fill="#9CA3AF"/>
  
  <!-- Calendar grid (7x6 simple) -->
  <rect x="50" y="155" width="180" height="125" fill="#EEEEEE"/>
  <!-- Day headers -->
  <rect x="55" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="80" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="105" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="130" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="155" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="180" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <rect x="205" y="160" width="20" height="12" rx="2" fill="#CCCCCC"/>
  <!-- Selected date -->
  <rect x="105" y="200" width="20" height="18" rx="2" fill="#9CA3AF"/>
  
  <!-- Upcoming events list -->
  <rect x="30" y="320" width="220" height="140" fill="white" stroke="#CCCCCC"/>
  <rect x="50" y="340" width="120" height="18" rx="4" fill="#9CA3AF"/>
  
  <rect x="50" y="375" width="160" height="10" rx="4" fill="#CCCCCC"/>
  <rect x="50" y="392" width="100" height="8" rx="4" fill="#EEEEEE"/>
  <line x1="50" y1="410" x2="210" y2="410" stroke="#EEEEEE" stroke-width="1"/>
  
  <rect x="50" y="420" width="140" height="10" rx="4" fill="#CCCCCC"/>
  <rect x="50" y="437" width="80" height="8" rx="4" fill="#EEEEEE"/>
  
  <!-- Quick actions -->
  <rect x="30" y="480" width="220" height="60" fill="white" stroke="#CCCCCC"/>
  <rect x="50" y="500" width="180" height="20" rx="4" fill="#9CA3AF"/>
  
  <!-- Tags/Categories -->
  <rect x="30" y="560" width="220" height="180" fill="white" stroke="#CCCCCC"/>
  <rect x="50" y="580" width="100" height="18" rx="4" fill="#9CA3AF"/>
  
  <rect x="50" y="615" width="60" height="16" rx="8" fill="#9CA3AF"/>
  <rect x="120" y="615" width="70" height="16" rx="8" fill="#CCCCCC"/>
  <rect x="50" y="645" width="80" height="16" rx="8" fill="#EEEEEE"/>
  <rect x="140" y="645" width="60" height="16" rx="8" fill="#9CA3AF"/>
  <rect x="50" y="675" width="70" height="16" rx="8" fill="#CCCCCC"/>
  <rect x="130" y="675" width="60" height="16" rx="8" fill="#EEEEEE"/>
  
  <!-- Main Calendar View -->
  <rect x="320" y="100" width="840" height="660" fill="white" stroke="#CCCCCC"/>
  
  <!-- Week header -->
  <rect x="320" y="100" width="840" height="50" fill="#EEEEEE"/>
  <rect x="360" y="117" width="100" height="16" rx="4" fill="#9CA3AF"/>
  <rect x="480" y="117" width="100" height="16" rx="4" fill="#CCCCCC"/>
  <rect x="600" y="117" width="100" height="16" rx="4" fill="#CCCCCC"/>
  <rect x="720" y="117" width="100" height="16" rx="4" fill="#CCCCCC"/>
  <rect x="840" y="117" width="100" height="16" rx="4" fill="#CCCCCC"/>
  <rect x="960" y="117" width="100" height="16" rx="4" fill="#CCCCCC"/>
  <rect x="1080" y="117" width="60" height="16" rx="4" fill="#CCCCCC"/>
  
  <!-- Time column -->
  <rect x="320" y="150" width="40" height="610" fill="#EEEEEE"/>
  <rect x="325" y="170" width="30" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="325" y="270" width="30" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="325" y="370" width="30" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="325" y="470" width="30" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="325" y="570" width="30" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="325" y="670" width="30" height="10" rx="2" fill="#CCCCCC"/>
  
  <!-- Grid lines (hours) -->
  <line x1="360" y1="250" x2="1160" y2="250" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="360" y1="350" x2="1160" y2="350" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="360" y1="450" x2="1160" y2="450" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="360" y1="550" x2="1160" y2="550" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="360" y1="650" x2="1160" y2="650" stroke="#EEEEEE" stroke-width="1"/>
  
  <!-- Grid lines (days) -->
  <line x1="480" y1="150" x2="480" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="600" y1="150" x2="600" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="720" y1="150" x2="720" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="840" y1="150" x2="840" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="960" y1="150" x2="960" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  <line x1="1080" y1="150" x2="1080" y2="760" stroke="#EEEEEE" stroke-width="1"/>
  
  <!-- Event blocks -->
  <rect x="370" y="260" width="100" height="80" rx="4" fill="#9CA3AF" opacity="0.7"/>
  <rect x="376" y="268" width="80" height="10" rx="2" fill="white"/>
  
  <rect x="490" y="360" width="100" height="60" rx="4" fill="#CCCCCC" opacity="0.7"/>
  <rect x="496" y="368" width="80" height="10" rx="2" fill="white"/>
  
  <rect x="610" y="280" width="100" height="120" rx="4" fill="#9CA3AF" opacity="0.7"/>
  <rect x="616" y="288" width="80" height="10" rx="2" fill="white"/>
  
  <rect x="850" y="460" width="100" height="80" rx="4" fill="#CCCCCC" opacity="0.7"/>
  <rect x="856" y="468" width="80" height="10" rx="2" fill="white"/>
  
  <rect x="730" y="560" width="100" height="60" rx="4" fill="#9CA3AF" opacity="0.7"/>
  <rect x="736" y="568" width="80" height="10" rx="2" fill="white"/>
  
  <rect x="970" y="180" width="100" height="100" rx="4" fill="#CCCCCC" opacity="0.7"/>
  <rect x="976" y="188" width="80" height="10" rx="2" fill="white"/>
</svg>
