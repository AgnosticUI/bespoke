  <rect x="360" y="354" width="160" height="14" rx="0" fill="#CCCCCC"/>
  <rect x="340" y="380" width="200" height="12" rx="0" fill="#CCCCCC"/>

  <rect x="620" y="240" width="280" height="200" rx="0" fill="#EEEEEE" stroke="#CCCCCC" stroke-dasharray="8 4"/>
