<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-selected Layouts — marketing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #475569; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
    .card {
      background: white; border: 2px solid #e2e8f0; border-radius: 12px; overflow: hidden;
      position: relative;
    }
    .badge {
      position: absolute; top: 8px; left: 8px; background: #0369a1; color: white;
      font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; z-index: 1;
    }
    .svg-container { padding: 12px; background: #f1f5f9; }
    .layout-svg { width: 100%; height: auto; display: block; border-radius: 4px; }
    .card-info { padding: 12px 16px; }
    .card-title { font-weight: 600; text-transform: capitalize; margin-bottom: 2px; }
    .card-meta { font-size: 0.75rem; color: #64748b; }
    .card-actions { padding: 8px 16px 12px; display: flex; align-items: center; gap: 0.5rem; }
    .copy-path-btn {
      background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 0.35rem 0.75rem;
      border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer;
    }
    .copy-path-btn:hover { background: #e2e8f0; }
    .copied-msg { color: #16a34a; font-weight: 600; font-size: 0.8rem; display: none; }
  </style>
</head>
<body>
  <h1>Pre-selected Layouts</h1>
  <p class="subtitle">Niche: <strong>marketing</strong> — LLM pre-selected layout options.</p>
  <div class="grid">

        <div class="card">
          <div class="badge">01</div>
          <div class="svg-container">
            <object data="option-01.svg" type="image/svg+xml" class="layout-svg">hero-logos-features</object>
          </div>
          <div class="card-info">
            <div class="card-title">hero logos features</div>
            <div class="card-meta">marketing_hero-logos-features_05.svg</div>
          </div>
          <div class="card-actions">
            <button class="copy-path-btn" onclick="copyFilePath(this, 'option-01.svg')">Copy file path</button>
            <span class="copied-msg">Copied!</span>
          </div>
        </div>

        <div class="card">
          <div class="badge">02</div>
          <div class="svg-container">
            <object data="option-02.svg" type="image/svg+xml" class="layout-svg">comparison-table</object>
          </div>
          <div class="card-info">
            <div class="card-title">comparison table</div>
            <div class="card-meta">marketing_comparison-table_08.svg</div>
          </div>
          <div class="card-actions">
            <button class="copy-path-btn" onclick="copyFilePath(this, 'option-02.svg')">Copy file path</button>
            <span class="copied-msg">Copied!</span>
          </div>
        </div>

        <div class="card">
          <div class="badge">03</div>
          <div class="svg-container">
            <object data="option-03.svg" type="image/svg+xml" class="layout-svg">nav-hero-pricing</object>
          </div>
          <div class="card-info">
            <div class="card-title">nav hero pricing</div>
            <div class="card-meta">marketing_nav-hero-pricing_04.svg</div>
          </div>
          <div class="card-actions">
            <button class="copy-path-btn" onclick="copyFilePath(this, 'option-03.svg')">Copy file path</button>
            <span class="copied-msg">Copied!</span>
          </div>
        </div>
  </div>
  <script>
    function copyFilePath(btn, filename) {
      const path = window.location.href.replace(/preview\.html.*$/, '') + filename;
      navigator.clipboard.writeText(path).then(() => {
        const msg = btn.nextElementSibling;
        msg.style.display = 'inline';
        setTimeout(() => msg.style.display = 'none', 2000);
      });
    }
  </script>
</body>
</html>
