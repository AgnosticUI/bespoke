        }

            border-color: #6366F1;
        }
        
        .palette-grid {
            display: grid;
            gap: 2rem;
            grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
        }
        
        .palette-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .palette-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .palette-header {
            padding: 1.875rem;
            border-bottom-width: 2px;
            border-bottom-style: solid;
            transition: all 0.2s;
        }
        
        .palette-number {
            font-size: 1.05rem;
            font-weight: 600;
        }
        
        .palette-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0.375rem 0 0.75rem;
        }
        
        .palette-notes {
            font-size: 1.05rem;
            font-style: italic;
        }
        
        .color-swatches {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
        }
        
        .swatch {
            aspect-ratio: 2/1;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .swatch:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        
        .swatch-label {
            position: absolute;
            bottom: 0.5rem;
            left: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.9);
            color: #1F2937;
        }
        
        .swatch-hex {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: rgba(0,0,0,0.7);
            color: white;
        }
        
        .color-row {
            display: flex;
            gap: 0;
        }
        
        .swatch-full {
            flex: 1;
            height: 90px;
            position: relative;
            cursor: pointer;
        }
        
        .swatch-label {
            position: absolute;
            bottom: 0.75rem;
            left: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.375rem 0.75rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.9);

            padding: 0.375rem 0.75rem;
            border-radius: 4px;
            background: rgba(0,0,0,0.7);
            color: white;
        }
        
        @media (max-width: 768px) {
            .palette-grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 1rem;
            }
        }

        function createSwatch(color, label) {
            return `
                <div class="swatch-full" style="background-color: ${color}" 
                     onclick="copyToClipboard('${color}')"
                     title="Click to copy ${color}">
                    <div class="swatch-label">${label}</div>
                    <div class="swatch-hex">${color}</div>
                </div>
            `;
        }
        
        function createPaletteCard(palette) {
            const bgColor = palette['Background (Hex)'];
            const textColor = palette['Text (Hex)'];
            const borderColor = palette['Border (Hex)'];
            
            return `
                <div class="palette-card">
                    <div class="palette-header" style="background-color: ${bgColor}; color: ${textColor}; border-bottom-color: ${borderColor};">
                        <div class="palette-number" style="color: ${textColor}; opacity: 0.6;">#${palette.No}</div>
                        <div class="palette-title" style="color: ${textColor};">${palette['Product Type']}</div>
                        <div class="palette-notes" style="color: ${textColor}; opacity: 0.75;">${palette.Notes}</div>
                    </div>
                    <div class="color-row">
                        ${createSwatch(palette['Primary (Hex)'], 'Primary')}
                        ${createSwatch(palette['Secondary (Hex)'], 'Secondary')}
                        ${createSwatch(palette['CTA (Hex)'], 'CTA')}
                    </div>
                    <div class="color-row">
                        ${createSwatch(palette['Background (Hex)'], 'Background')}
                        ${createSwatch(palette['Text (Hex)'], 'Text')}
                        ${createSwatch(palette['Border (Hex)'], 'Border')}
                    </div>
                </div>
            `;
        }
        
        function renderPalettes(filteredPalettes = palettes) {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = filteredPalettes.map(createPaletteCard).join('');
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert(`Copied ${text} to clipboard!`);
            });
        }
        
        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = palettes.filter(p => 
                p['Product Type'].toLowerCase().includes(searchTerm) ||
                p.Notes.toLowerCase().includes(searchTerm) ||
                Object.values(p).some(v => 
                    typeof v === 'string' && v.toLowerCase().includes(searchTerm)
                )
            );
            renderPalettes(filtered);
        });
        
        // Initial render
        renderPalettes();
    </script>
</body>
</html>
