<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#DDDDDD"/>
  <rect x="40" y="18" width="140" height="24" rx="10" fill="#9CA3AF"/>
  <rect x="500" y="20" width="80" height="20" rx="8" fill="#9CA3AF"/>
  <rect x="600" y="20" width="80" height="20" rx="8" fill="#9CA3AF"/>
  <rect x="700" y="20" width="80" height="20" rx="8" fill="#9CA3AF"/>
  <rect x="1020" y="12" width="140" height="36" rx="10" fill="#9CA3AF"/>

  <!-- Hero Banner -->
  <rect x="0" y="60" width="1200" height="200" fill="#EEEEEE"/>
  <rect x="300" y="110" width="600" height="36" rx="10" fill="#9CA3AF"/>
  <rect x="350" y="160" width="500" height="16" rx="8" fill="#CCCCCC"/>
  <rect x="380" y="190" width="440" height="16" rx="8" fill="#CCCCCC"/>

  <!-- Reservation Form Card -->
  <rect x="200" y="290" width="800" height="420" rx="20" fill="white" stroke="#CCCCCC"/>
  <rect x="240" y="326" width="240" height="24" rx="8" fill="#9CA3AF"/>

  <!-- Date Picker -->
  <rect x="240" y="374" width="80" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="240" y="400" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>

  <!-- Time Picker -->
  <rect x="620" y="374" width="80" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="620" y="400" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>

  <!-- Party Size -->
  <rect x="240" y="468" width="80" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="240" y="494" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>

  <!-- Seating Preference -->
  <rect x="620" y="468" width="120" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="620" y="494" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>

  <!-- Contact Info -->
  <rect x="240" y="562" width="80" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="240" y="588" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>
  <rect x="620" y="562" width="60" height="16" rx="6" fill="#CCCCCC"/>
  <rect x="620" y="588" width="340" height="44" rx="10" fill="white" stroke="#CCCCCC"/>

  <!-- Special Requests -->
  <rect x="240" y="652" width="120" height="16" rx="6" fill="#CCCCCC"/>

  <!-- Submit Button -->
  <rect x="400" y="690" width="400" height="50" rx="12" fill="#9CA3AF"/>

  <!-- Footer -->
  <rect x="0" y="740" width="1200" height="60" fill="#DDDDDD"/>
</svg>
