<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&family=Figtree:wght@300;400;500;600;700&display=swap');
</style>
  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#DDDDDD"/>
  <rect x="40" y="18" width="140" height="24" rx="10" fill="#9CA3AF"/>
  <rect x="1020" y="12" width="140" height="36" rx="10" fill="#9CA3AF"/>

  <!-- Video Area -->
  <rect x="40" y="80" width="800" height="520" rx="12" fill="#EEEEEE"/>
  <!-- Self video -->
  <rect x="620" y="100" width="200" height="140" rx="10" fill="#DDDDDD"/>

  <!-- Video Controls -->
  <rect x="280" y="520" width="320" height="50" rx="12" fill="#DDDDDD"/>
  <rect x="300" y="530" width="40" height="30" rx="8" fill="#9CA3AF"/>
  <rect x="354" y="530" width="40" height="30" rx="8" fill="#9CA3AF"/>
  <rect x="408" y="530" width="40" height="30" rx="8" fill="#9CA3AF"/>
  <rect x="462" y="530" width="40" height="30" rx="8" fill="#9CA3AF"/>
  <rect x="516" y="530" width="60" height="30" rx="8" fill="#9CA3AF"/>

  <!-- Right Panel - Chat & Notes -->
  <rect x="860" y="80" width="300" height="520" rx="12" fill="white" stroke="#CCCCCC"/>
  <!-- Tabs -->
  <rect x="860" y="80" width="150" height="40" rx="10" fill="#9CA3AF"/>
  <rect x="1010" y="80" width="150" height="40" rx="10" fill="#EEEEEE"/>
  <!-- Chat Messages -->
  <rect x="880" y="140" width="200" height="50" rx="10" fill="#EEEEEE"/>
  <rect x="890" y="152" width="180" height="12" rx="8" fill="#CCCCCC"/>
  <rect x="890" y="170" width="140" height="12" rx="8" fill="#CCCCCC"/>

  <rect x="960" y="206" width="180" height="50" rx="10" fill="#9CA3AF"/>

  <rect x="880" y="272" width="220" height="50" rx="10" fill="#EEEEEE"/>
  <rect x="890" y="284" width="200" height="12" rx="8" fill="#CCCCCC"/>
  <rect x="890" y="302" width="160" height="12" rx="8" fill="#CCCCCC"/>

  <rect x="960" y="338" width="180" height="50" rx="10" fill="#9CA3AF"/>

  <!-- Chat Input -->
  <rect x="880" y="546" width="220" height="36" rx="10" fill="white" stroke="#CCCCCC"/>
  <rect x="1120" y="546" width="24" height="36" rx="10" fill="#9CA3AF"/>

  <!-- Patient Info Bar -->
  <rect x="40" y="620" width="1120" height="80" rx="12" fill="white" stroke="#CCCCCC"/>
  <rect x="60" y="636" width="60" height="48" rx="24" fill="#EEEEEE"/>
  <rect x="136" y="640" width="200" height="18" rx="8" fill="#9CA3AF"/>
  <rect x="136" y="666" width="160" height="14" rx="8" fill="#CCCCCC"/>
  <rect x="500" y="644" width="120" height="14" rx="8" fill="#CCCCCC"/>
  <rect x="500" y="666" width="100" height="14" rx="8" fill="#CCCCCC"/>
  <rect x="760" y="644" width="140" height="14" rx="8" fill="#CCCCCC"/>
  <rect x="760" y="666" width="120" height="14" rx="8" fill="#CCCCCC"/>
  <rect x="1000" y="640" width="140" height="36" rx="10" fill="#9CA3AF"/>

  <!-- Quick Actions -->
  <rect x="40" y="720" width="1120" height="60" rx="12" fill="#EEEEEE"/>
  <rect x="80" y="736" width="160" height="28" rx="10" fill="#9CA3AF"/>
  <rect x="260" y="736" width="160" height="28" rx="10" fill="white" stroke="#CCCCCC"/>
  <rect x="440" y="736" width="160" height="28" rx="10" fill="white" stroke="#CCCCCC"/>
  <rect x="620" y="736" width="160" height="28" rx="10" fill="white" stroke="#CCCCCC"/>

  <g class="preview-label">
    <rect x="10" y="7" width="30" height="24" rx="4" fill="#0369A1"/>
    <text x="25" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600" font-family="system-ui">8</text>
  </g>
</svg>
