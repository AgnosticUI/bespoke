<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<style>

    [data-role="background"], .background { fill: #F8FAFC; }
    [data-role="primary"], .primary { fill: #059669; }
    [data-role="secondary"], .secondary { fill: #34D399; }
    [data-role="cta"], .cta, .button { fill: #0284C7; }
    [data-role="border"], .border { stroke: #E2E8F0; }
    [data-role="text"], text { fill: #0F172A; }
  
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto&display=swap');
</style>
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" data-role="background"/>
  <rect x="20" y="20" width="360" height="60" rx="8" fill="#0066cc" data-role="primary"/>
  <textx="40" y="58" font-size="24" class="heading" font-family="'Inter', sans-serif" font-weight="600" fill="#0F172A">Dashboard</text>
  <textx="40" y="120" font-size="14" font-family="'Roboto', sans-serif" font-weight="400" fill="#0F172A">Welcome to your dashboard. Here you can view your metrics.</text>
  <rect x="20" y="160" width="120" height="40" rx="4" fill="#ff6600" data-role="cta"/>
  <textx="80" y="186" text-anchor="middle" font-size="14"  font-family="'Roboto', sans-serif" font-weight="400" fill="#0F172A">Get Started</text>

  <g class="preview-label">
    <rect x="10" y="7" width="30" height="24" rx="4" fill="#0369A1"/>
    <text x="25" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600" font-family="system-ui">1</text>
  </g>
</svg>