  <line x1="96" y1="244" x2="376" y2="244" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
  <line x1="96" y1="279" x2="376" y2="279" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
